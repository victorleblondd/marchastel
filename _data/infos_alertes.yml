- date: "2026-04-14"
  type: info
  theme: vie
  titre: "Écobuages : prudence, et déclaration obligatoire"
  resume: "Des dizaines d'hectares sont déjà partis en fumée dans le Cantal. Pour tout écobuage avant le 30 avril, une déclaration préalable en mairie et aux pompiers est indispensable, sous peine d'une amende de 450 €."
  lien: "/vie-pratique/#ecobuage"
  lien_texte: "Écobuage : les règles et les bons gestes"
  texte: |
    <p>La gendarmerie du Cantal est déjà intervenue à plus de quinze reprises ces derniers jours pour des écobuages non maîtrisés. Des dizaines d'hectares sont déjà partis en fumée.</p>
    <p><strong>Rappel</strong> : la pratique de l'écobuage est réglementée par arrêté préfectoral. Pour tout écobuage avant le 30 avril de chaque année, une <strong>déclaration préalable en mairie et aux pompiers</strong> est indispensable.</p>
    <p>Au-delà de la sanction (amende de 450 €), le risque est l'incendie non maîtrisé, qui mobilise d'importants moyens de protection et peut imposer l'évacuation d'habitants et la déviation de routes. Pensez aux conséquences du feu, mais aussi à celles de la propagation des fumées.</p>
    <p>Les bonnes pratiques :</p>
    <ul>
      <li>s'assurer que l'espace autour du feu est suffisamment dégagé pour éviter la propagation ;</li>
      <li>tenir compte du vent et de son évolution dans la durée ;</li>
      <li>travailler en fractionnant les éléments à brûler ;</li>
      <li>être en capacité d'éteindre le foyer à tout moment (eau à proximité) ;</li>
      <li>rester présent tout le temps et rester joignable par téléphone.</li>
    </ul>
    <p>Ensemble, soyons responsables.</p>

