- date: "2026-08-07"
  type: alerte
  theme: eau
  titre: "Restrictions de l'usage de l'eau : la commune en crise sécheresse"
  resume: "Les châteaux d'eau sont au plus bas et la préfecture a renforcé les restrictions d'usage de l'eau du réseau. Économisez l'eau et signalez toute fuite à la mairie."
  texte: |
    <p>En raison des conditions météorologiques, nous sommes en <strong>état de crise sécheresse</strong> et les niveaux des châteaux d'eau sont au plus bas. Rien ne laisse espérer une amélioration de la situation à court terme : nous devons tous et toutes économiser l'eau.</p>
    <p><strong>Restrictions d'usage.</strong> La préfecture a renforcé les restrictions. En résumé, il est interdit d'utiliser l'eau du réseau pour :</p>
    <ul>
      <li>arroser les jardins entre 8 h et 20 h ;</li>
      <li>arroser les pelouses, les massifs fleuris, les arbres et les arbustes (sous conditions) ;</li>
      <li>nettoyer les véhicules, les terrasses, les façades et les toitures (hors contraintes sanitaires) ;</li>
      <li>remplir ou remettre à niveau les piscines et les spas.</li>
    </ul>
    <p>Le détail des mesures figure dans l'<a href="https://www.cantal.gouv.fr/contenu/telechargement/25769/200901/file/AP_Limitation_Cantal_2026-08-06_signe.pdf">arrêté préfectoral du 6 août 2026</a> (PDF) et sur <a href="https://vigieau.gouv.fr/">vigieau.gouv.fr</a>, constamment mis à jour.</p>
    <p><strong>Signalement des fuites.</strong> Chaque goutte compte : une fuite sur le réseau ou chez un particulier peut fragiliser l'ensemble de la distribution. Signalez-nous les fuites, même réparées, au <a href="tel:+33471784015">04 71 78 40 15</a>, au <a href="tel:+33471784022">04 71 78 40 22</a> ou au <a href="tel:+33648367086">06 48 36 70 86</a> : ces informations sont indispensables au technicien pour analyser les chutes de pression et maintenir le niveau des châteaux d'eau.</p>
    <p><strong>Appel à la sobriété.</strong> Nous comptons sur le civisme, la responsabilité et la solidarité de chacun pour réduire au strict minimum sa consommation :</p>
    <ul>
      <li>particuliers : douches très courtes, fermeture des robinets, report des lavages non essentiels ou lavages à pleine charge… ;</li>
      <li>professionnels : surveillance des systèmes d'arrêt et des flotteurs pour l'alimentation du bétail.</li>
    </ul>
    <p>Sans cette sobriété partagée par tous, des interruptions de l'alimentation en eau potable seront inévitables. Merci par avance pour votre coopération et votre vigilance.</p>
    <p><em>Mise à jour : le 31 août 2026, les restrictions ont été ramenées au niveau d'alerte renforcée (voir l'avis du 8 septembre).</em></p>

