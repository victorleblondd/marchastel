- date: "2026-09-08"
  type: info
  theme: eau
  titre: "Eau : assouplissement des restrictions au 31 août"
  resume: "Grâce aux pluies, les restrictions d'eau sont revenues au niveau d'alerte renforcée le 31 août. La situation reste fragile : chacun est invité à utiliser l'eau de manière responsable et mesurée."
  texte: |
    <p>Les pluies des dernières semaines ont concerné l'ensemble du département et permis aux cours d'eau de retrouver des débits plus importants. Malgré des volumes parfois conséquents, la situation reste fragile et temporaire, l'été étant encore loin d'être terminé.</p>
    <p>Cette légère amélioration a permis de ramener les mesures de restriction au niveau d'<strong>alerte renforcée</strong> le 31 août 2026.</p>
    <p>Il nous est malgré tout demandé d'utiliser de manière responsable et mesurée cette ressource précieuse et fragile, absolument nécessaire.</p>
    <p>Pour en savoir plus : le <a href="https://www.cantal.gouv.fr/contenu/telechargement/25884/201814/file/20260827%20CP_S%C3%A9cheresse%20S35_VD.pdf">communiqué de la préfecture du Cantal</a> (PDF).</p>

